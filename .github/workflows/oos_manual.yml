name: OOS manual
# Evaluación Out-of-Sample: SOLO a mano (BUGS_REPORT.md H-07; decisión del
# usuario, auditoría 2026-10-05). El nightly mira solo el In-Sample. El OOS
# se evalúa UNA vez: si después de mirarlo se ajusta algún parámetro, el
# holdout ya no vale. Cada lanzamiento queda apuntado en la tabla oos_runs
# (fecha, tag, commit, quién y por qué), y el informe lleva el sufijo -OOS y
# el aviso OOS_WARNING. La app y las comparaciones lo ignoran (NO_ES_OOS_SQL).
# Sin IA: trabaja sobre lo que ya hay en la base de datos.
run-name: "OOS manual: ${{ github.event.inputs.motivo }}"

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por qué se mira el OOS ahora (queda registrado en oos_runs)"
        required: true

# El mismo grupo que la pasada nocturna: no escriben a la vez en la base.
concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Backtest de cartera Out-of-Sample
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOTIVO: ${{ github.event.inputs.motivo }}
        run: python -m pipeline.backtest.portfolio_report --oos --motivo "$MOTIVO"
      - name: Validación Out-of-Sample
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MOTIVO: ${{ github.event.inputs.motivo }}
        run: python -m pipeline.validation.report --persist-only --oos --motivo "$MOTIVO"
