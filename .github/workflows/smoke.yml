name: Prueba de humo de la IA
# Analiza con la IA REAL solo N eventos de la cola (máximo 20) y deja un
# informe de qué salió, qué falló y cuánto costó de verdad (Tanda 6;
# pipeline/analyze/smoke.py). GASTA SALDO de la API de Anthropic: solo se
# lanza a mano (Actions → «Prueba de humo de la IA» → Run workflow); nunca
# está programado. Respeta el tope diario de gasto.
run-name: "Prueba de humo de la IA (${{ github.event.inputs.n }} eventos)"

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Eventos a analizar con la IA (1-20)"
        required: true
        default: "5"

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Asegurar el esquema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from pipeline.db.connection import get_connection, init_schema; init_schema(get_connection())"
      - name: Prueba de humo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MIN_MARKET_CAP_USD: ${{ vars.ANALYSIS_MIN_MARKET_CAP_USD }}
          N: ${{ github.event.inputs.n }}
        run: python -m pipeline.analyze.smoke --n "$N"
